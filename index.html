<title>IronTrade Journal V8</title>
<style>
:root{--bg:#0b1220;--panel:#121e30;--panel2:#19283d;--text:#edf3fb;--muted:#9aabc0;--line:#293950;--gold:#e6b84c;--green:#38c98a;--red:#f07878;--blue:#75a9ff;--orange:#efa64d}
*{box-sizing:border-box}body{margin:0;padding:16px 11px 35px;min-height:100vh;background:linear-gradient(145deg,#0b1220,#101d30);color:var(--text);font-family:Arial,Tahoma,sans-serif}
.app{max-width:820px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:13px;background:var(--gold);color:#182234;display:grid;place-items:center;font-weight:900;font-size:20px}
h1{font-size:19px;margin:0}.subtitle{font-size:12px;color:var(--muted);margin-top:5px}button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:11px 13px;cursor:pointer;font-weight:700}.lang,.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:13px}.section-title{font-size:16px;margin:0 0 13px;font-weight:800}.sub-title{font-size:14px;margin:17px 0 9px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:var(--panel2);border-radius:11px;padding:13px 7px;text-align:center;min-width:0}.stat strong{display:block;font-size:20px;margin-bottom:6px;overflow-wrap:anywhere}.stat span{font-size:11px;color:var(--muted)}
.green{color:var(--green)}.red{color:var(--red)}.gold{color:var(--gold)}.blue{color:var(--blue)}.orange{color:var(--orange)}
.progress{height:9px;background:#26364c;border-radius:20px;overflow:hidden}.progress>div{height:100%;width:0;background:var(--green);transition:.2s}.progress-head{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin:10px 0 7px}
.checklist{display:grid;gap:8px}.check{display:flex;align-items:center;gap:10px;background:var(--panel2);padding:11px;border-radius:10px;font-size:13px}.check input{width:18px;height:18px;accent-color:var(--green)}
.notice{font-size:12px;line-height:1.7;color:var(--muted);margin:11px 0 0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}label{font-size:12px;color:var(--muted)}
input,select,textarea{width:100%;min-width:0;background:#0c1727;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--blue)}textarea{min-height:75px;resize:vertical}
.primary{background:var(--gold);color:#182234;width:100%;margin-top:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}
.trade,.analysis-row{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px;margin-top:9px}.trade-top,.analysis-row{display:flex;justify-content:space-between;align-items:center;gap:10px}.trade-name{font-weight:800}.trade-meta,.analysis-detail{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.7}.trade-note{font-size:13px;white-space:pre-wrap;line-height:1.6;margin-top:8px}
.tag{font-size:11px;padding:5px 8px;border-radius:20px;background:#26364c}.tag.win{color:var(--green)}.tag.loss{color:var(--red)}.tag.be{color:var(--gold)}.delete{background:transparent;color:var(--red);padding:6px;font-size:12px}.empty{text-align:center;color:var(--muted);padding:17px;font-size:13px}
.score-circle{width:112px;height:112px;border-radius:50%;border:8px solid var(--green);display:flex;flex-direction:column;justify-content:center;align-items:center;margin:8px auto 14px;background:var(--panel2)}.score-circle strong{font-size:29px}.score-circle span{font-size:11px;color:var(--muted)}
.alert{padding:11px;border-radius:10px;font-size:12px;line-height:1.7;margin-top:9px;background:#30291c;color:#f2c878}.alert.bad{background:#351f29;color:#ffaaaa}.alert.good{background:#15352c;color:#8ee0b8}
.rule-row{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.rule-row:last-child{border:0}.chart{display:flex;align-items:end;gap:5px;height:125px;padding:10px 3px;border-bottom:1px solid var(--line);overflow:hidden}.chart-col{flex:1;min-width:5px;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:4px}.chart-bar{width:100%;max-width:25px;border-radius:4px 4px 0 0;min-height:2px}.chart-bar.pos{background:var(--green)}.chart-bar.neg{background:var(--red)}.chart-label{font-size:9px;color:var(--muted)}
.filters{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px;margin-top:12px}.footer{text-align:center;font-size:11px;color:var(--muted);margin-top:18px}
@media(max-width:520px){body{padding:12px 9px 30px}.stats{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.filters{grid-template-columns:1fr}h1{font-size:17px}}

#authPanel .actions button{min-width:125px}#authPanel [hidden]{display:none!important}#authStatus{font-weight:700}#authStatus.online{color:var(--green)}#authStatus.offline{color:var(--orange)}
</style>
</head>
<body><div class="app">
<header><div class="brand"><div class="logo">IT</div><div><h1>IronTrade Journal</h1><div class="subtitle" id="subtitle"></div></div></div><button class="lang" id="langBtn">EN</button></header>

<section class="panel" id="authPanel">
  <h2 class="section-title" id="authTitle">الحساب والمزامنة السحابية</h2>
  <p class="notice" id="authStatus">جارٍ تهيئة الاتصال...</p>
  <div class="form-grid" id="authFields">
    <div class="field"><label for="authEmail" id="authEmailLabel">البريد الإلكتروني</label><input id="authEmail" type="email" autocomplete="email" placeholder="name@example.com"></div>
    <div class="field"><label for="authPassword" id="authPasswordLabel">كلمة المرور</label><input id="authPassword" type="password" autocomplete="current-password" minlength="6" placeholder="6 أحرف على الأقل"></div>
  </div>
  <div class="actions" style="margin-top:10px">
    <button class="secondary" id="signInBtn" type="button">تسجيل الدخول</button>
    <button class="secondary" id="signUpBtn" type="button">إنشاء حساب</button>
    <button class="secondary" id="signOutBtn" type="button" hidden>تسجيل الخروج</button>
    <button class="secondary" id="syncBtn" type="button" hidden>مزامنة الآن</button>
  </div>
  <p class="notice" id="authHint">يمكنك استخدام التطبيق محليًا دون تسجيل الدخول. عند تسجيل الدخول، تتم مزامنة صفقاتك مع حسابك.</p>
</section>


<section class="panel"><h2 class="section-title" id="statsTitle"></h2><div class="stats">
<div class="stat"><strong class="blue" id="total">0</strong><span id="totalLabel"></span></div><div class="stat"><strong class="green" id="wins">0</strong><span id="winsLabel"></span></div><div class="stat"><strong class="red" id="losses">0</strong><span id="lossesLabel"></span></div><div class="stat"><strong class="gold" id="rate">0%</strong><span id="rateLabel"></span></div></div></section>

<section class="panel"><h2 class="section-title" id="financeTitle"></h2><div class="field"><label id="capitalLabel" for="capital"></label><input id="capital" type="number" min="0" step=".01" value="100"></div>
<div class="stats" style="margin-top:12px"><div class="stat"><strong class="green" id="grossProfit">$0</strong><span id="grossProfitLabel"></span></div><div class="stat"><strong class="red" id="grossLoss">$0</strong><span id="grossLossLabel"></span></div><div class="stat"><strong id="netProfit">$0</strong><span id="netProfitLabel"></span></div><div class="stat"><strong class="gold" id="profitFactor">—</strong><span id="profitFactorLabel"></span></div></div>
<div class="stats" style="margin-top:8px"><div class="stat"><strong class="green" id="avgWin">$0</strong><span id="avgWinLabel"></span></div><div class="stat"><strong class="red" id="avgLoss">$0</strong><span id="avgLossLabel"></span></div><div class="stat"><strong class="blue" id="currentBalance">$100</strong><span id="balanceLabel"></span></div><div class="stat"><strong id="knownTrades">0</strong><span id="knownTradesLabel"></span></div></div>
<div class="stats" style="margin-top:8px"><div class="stat"><strong class="red" id="maxDrawdown">$0</strong><span id="drawdownLabel"></span></div><div class="stat"><strong class="orange" id="maxLossStreak">0</strong><span id="streakLabel"></span></div><div class="stat"><strong class="blue" id="returnPct">0%</strong><span id="returnLabel"></span></div><div class="stat"><strong id="expectancy">$0</strong><span id="expectancyLabel"></span></div></div>
<p class="notice" id="financeNote"></p><h3 class="sub-title" id="equityTitle"></h3><div class="chart" id="equityChart"></div><p class="notice" id="chartNote"></p></section>

<section class="panel"><h2 class="section-title" id="scoreTitle"></h2><div class="score-circle"><strong id="disciplineScore">0</strong><span id="outOf">/100</span></div><div class="progress"><div id="scoreBar"></div></div><p class="notice" id="scoreDescription"></p><div class="stats" style="margin-top:13px">
<div class="stat"><strong class="green" id="compliantCount">0</strong><span id="compliantLabel"></span></div><div class="stat"><strong class="red" id="incompleteCount">0</strong><span id="incompleteLabel"></span></div><div class="stat"><strong class="red" id="riskViolations">0</strong><span id="riskViolationsLabel"></span></div><div class="stat"><strong class="orange" id="preferredRisk">0</strong><span id="preferredRiskLabel"></span></div></div></section>

<section class="panel"><h2 class="section-title" id="riskRulesTitle"></h2><div class="rule-row"><span id="ruleOne"></span><strong class="green">1%</strong></div><div class="rule-row"><span id="ruleTwo"></span><strong class="orange">2%</strong></div><div class="rule-row"><span id="ruleThree"></span><strong class="red">2%+</strong></div><div id="riskAlert" class="notice"></div></section>

<section class="panel"><h2 class="section-title" id="checkTitle"></h2><div class="checklist" id="checklist"></div><div class="progress-head"><span id="progressLabel"></span><span id="progressText">0/6</span></div><div class="progress"><div id="progressBar"></div></div><p class="notice" id="checkNotice"></p></section>

<section class="panel"><h2 class="section-title" id="formTitle"></h2><form id="tradeForm"><div class="form-grid">
<div class="field"><label id="pairLabel" for="pair"></label><input id="pair" value="EURUSD" required maxlength="20"></div>
<div class="field"><label id="dateLabel" for="date"></label><input id="date" type="date" required></div>
<div class="field"><label id="timeLabel" for="tradeTime"></label><input id="tradeTime" type="time" required></div>
<div class="field"><label id="directionLabel" for="direction"></label><select id="direction"><option value="BUY">BUY</option><option value="SELL">SELL</option></select></div>
<div class="field"><label id="resultLabel" for="result"></label><select id="result"><option value="WIN">WIN</option><option value="LOSS">LOSS</option><option value="BE">BE</option></select></div>
<div class="field"><label id="riskLabel" for="risk"></label><input id="risk" type="number" min=".1" max="100" step=".1" placeholder="1" required></div>
<div class="field"><label id="pnlLabel" for="pnl"></label><input id="pnl" type="number" step=".01" placeholder="2.50" required></div>
<div class="field"><label id="timeframeLabel" for="timeframe"></label><select id="timeframe"><option>M5</option><option>M15</option><option>M30</option><option>H1</option><option>H4</option><option>D1</option></select></div>
<div class="field full"><label id="notesLabel" for="notes"></label><textarea id="notes" maxlength="1500"></textarea></div></div><div id="liveRiskAlert"></div><div id="livePnlAlert"></div><button class="primary" id="saveBtn" type="submit"></button></form></section>

<section class="panel"><h2 class="section-title" id="sessionTitle"></h2><p class="notice" id="sessionNote"></p><div id="sessionAnalysis"></div><h3 class="sub-title" id="hourTitle"></h3><div id="hourAnalysis"></div><h3 class="sub-title" id="directionAnalysisTitle"></h3><div id="directionAnalysis"></div></section>

<section class="panel"><h2 class="section-title" id="errorTitle"></h2><div id="errorReport"></div><h3 class="sub-title" id="pairAnalysisTitle"></h3><div id="pairAnalysis"></div><h3 class="sub-title" id="timeAnalysisTitle"></h3><div id="timeAnalysis"></div></section>

<section class="panel"><h2 class="section-title" id="monthlyTitle"></h2><div class="stats"><div class="stat"><strong class="blue" id="monthTrades">0</strong><span id="monthTradesLabel"></span></div><div class="stat"><strong class="gold" id="monthScore">0</strong><span id="monthScoreLabel"></span></div><div class="stat"><strong class="green" id="monthWins">0</strong><span id="monthWinsLabel"></span></div><div class="stat"><strong class="red" id="monthLosses">0</strong><span id="monthLossesLabel"></span></div></div><p class="notice" id="monthNote"></p></section>

<section class="panel"><h2 class="section-title" id="historyTitle"></h2>
<div class="actions"><button class="secondary" id="exportBtn"></button><button class="secondary" id="importBtn"></button><input id="importFile" type="file" accept=".json,application/json" hidden><button class="secondary" id="clearFilterBtn"></button></div>
<div class="filters"><input id="searchTrade" type="search" placeholder="Search / بحث"><select id="filterResult"><option value="ALL">All results</option><option value="WIN">WIN</option><option value="LOSS">LOSS</option><option value="BE">BE</option></select><select id="filterPair"><option value="ALL">All pairs</option></select></div>
<div id="filterSummary" class="notice"></div><div id="tradeList"></div></section>
<div class="footer" id="footerText"></div></div>

function uuidValue(value){
  const s=String(value||"");
  if(/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(s))return s;
  if(crypto&&crypto.randomUUID)return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==="x"?r:(r&3|8)).toString(16)});
}
function toCloudTrade(a){

    direction:a.direction==="BUY"?"buy":"sell",

    timeframe:a.timeframe||null,notes:a.notes||null,checks:getChecks(a)

function fromCloudTrade(a){

    direction:a.direction==="buy"?"BUY":"SELL",

async function pullCloudTrades(merge=true){
  if(!supabaseClient||!currentUser)return;
  const {data,error}=await supabaseClient.from("trades").select("*").eq("user_id",currentUser.id).order("trade_date",{ascending:true});
  if(error)throw error;
  const remote=(data||[]).map(fromCloudTrade);
  if(merge){
    const map=new Map(trades.map(a=>[a.id,a]));
    remote.forEach(a=>map.set(a.id,a));
    trades=[...map.values()].sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  }else trades=remote;
  saveData();render();
}
async function syncCloud(){
  if(!supabaseClient||!currentUser){setAuthStatus(authMessage("سجّل الدخول أولًا.","Please sign in first."),"offline");return}
  if(cloudBusy)return;
  cloudBusy=true;document.getElementById("syncBtn").disabled=true;
  setAuthStatus(authMessage("جارٍ مزامنة الصفقات...","Syncing trades..."));
  try{
    const payload=trades.map(toCloudTrade);
    if(payload.length){
      const {error}=await supabaseClient.from("trades").upsert(payload,{onConflict:"id"});
      if(error)throw error;
    }
    await pullCloudTrades(true);
    localStorage.setItem("ironTradeCloudMigrated_"+currentUser.id,"yes");
    setAuthStatus(authMessage("اكتملت المزامنة بنجاح.","Sync completed successfully."),"online");
  }catch(err){
    console.error("IronTrade sync error:",err);
    setAuthStatus(authMessage("تعذرت المزامنة: ","Sync failed: ")+(err.message||"Unknown error"),"offline");
  }finally{
    cloudBusy=false;document.getElementById("syncBtn").disabled=false;
  }
}
async function afterLogin(){
  renderAuthState();
  if(!currentUser)return;
  const marker="ironTradeCloudMigrated_"+currentUser.id;
  if(localStorage.getItem(marker)!=="yes"&&trades.length){
    const ok=confirm(authMessage(
      "لديك "+trades.length+" صفقة محفوظة على هذا الجهاز. هل تريد رفعها إلى حسابك السحابي؟",
      "You have "+trades.length+" trades saved on this device. Upload them to your cloud account?"
    ));
    if(ok){await syncCloud();return}
    try{await pullCloudTrades(true);setAuthStatus(authMessage("تم تحميل صفقات الحساب. لم تُرفع البيانات المحلية بعد.","Account trades loaded. Local trades have not been uploaded yet."),"online")}
    catch(err){setAuthStatus(authMessage("تعذر تحميل الصفقات: ","Could not load trades: ")+(err.message||""),"offline")}
  }else{
    try{await syncCloud()}catch(err){console.error(err)}
  }
}
async function initCloud(){
  if(!window.supabase||!window.supabase.createClient){
    setAuthStatus(authMessage("تعذر تحميل مكتبة الاتصال. تحقق من الإنترنت.","Could not load the connection library. Check your internet."),"offline");return;
  }
  supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
  const {data,error}=await supabaseClient.auth.getSession();
  if(error){setAuthStatus(error.message,"offline");return}
  currentUser=data.session?.user||null;
  renderAuthState();
  if(currentUser)await afterLogin();
  supabaseClient.auth.onAuthStateChange((_event,session)=>{
    currentUser=session?.user||null;renderAuthState();
    if(currentUser)Promise.resolve().then(()=>afterLogin());
  });
}

let rt=risk>2?(lang==="ar"?"مخالفة مخاطرة":"Risk violation"):risk>1?(lang==="ar"?"ضمن الحد الأعلى":"Within maximum"):risk>0?(lang==="ar"?"ضمن المستوى المفضل":"Preferred risk"):(lang==="ar"?"المخاطرة غير مسجلة":"Risk not recorded");
let pnl=hasPnl(a)?money(Number(a.pnl)):x.financialMissing,pc=hasPnl(a)?(Number(a.pnl)>0?"green":Number(a.pnl)<0?"red":"gold"):"";
return `<article class="trade"><div class="trade-top"><div><div class="trade-name">${esc(a.pair)} · ${a.direction==="BUY"?x.buy:x.sell}</div><div class="trade-meta">${esc(a.date)} · ${esc(a.time||x.noTime)} · ${esc(a.timeframe||"—")} · ${risk}%</div></div><span class="tag ${rc}">${x[rc]||x.be}</span></div><div class="trade-meta">${count===6?x.complete:x.incomplete} (${count}/6)</div><div class="trade-meta">${rt} · ${lang==="ar"?"الانضباط":"Discipline"}: ${scoreTrade(a)}/100</div><div class="trade-meta">${lang==="ar"?"النتيجة المالية":"Financial result"}: <strong class="${pc}">${pnl}</strong></div><div class="trade-meta">${x.checklistStatus}: ${c.map((v,i)=>v?"✓ "+x.checks[i]:"").filter(Boolean).join(" · ")||"—"}</div>${a.notes?`<div class="trade-note">${esc(a.notes)}</div>`:""}<div style="text-align:end"><button class="delete" data-delete="${esc(a.id)}">${x.delete}</button></div></article>`;
}).join("");
}
function updateRiskAlert(){
let x=t(),v=document.getElementById("risk").value,b=document.getElementById("liveRiskAlert");
if(v===""){b.className="notice";b.textContent=x.riskMissing;return}
let n=Number(v);if(!Number.isFinite(n)||n<=0||n>100){b.className="alert bad";b.textContent=x.riskError}else if(n<=1){b.className="alert good";b.textContent=x.riskPreferred}else if(n<=2){b.className="alert";b.textContent=x.riskAllowed}else{b.className="alert bad";b.textContent=x.riskExceeded}
}
function updatePnlAlert(){
let r=document.getElementById("result").value,v=document.getElementById("pnl").value,b=document.getElementById("livePnlAlert"),x=t();
if(v===""){b.className="notice";b.textContent=x.pnlHint;return}
let n=Number(v),ok=Number.isFinite(n)&&((r==="WIN"&&n>0)||(r==="LOSS"&&n<0)||(r==="BE"&&n===0));
b.className=ok?"alert good":"alert bad";b.textContent=ok?x.pnlHint:x.pnlError;
}
document.getElementById("langBtn").addEventListener("click",()=>{lang=lang==="ar"?"en":"ar";localStorage.setItem(LANG_KEY,lang);setLanguage()});
document.getElementById("checklist").addEventListener("change",e=>{if(e.target.matches("[data-check]")){checks[Number(e.target.dataset.check)]=e.target.checked;saveData();render()}});
document.getElementById("risk").addEventListener("input",updateRiskAlert);document.getElementById("pnl").addEventListener("input",updatePnlAlert);document.getElementById("result").addEventListener("change",updatePnlAlert);
document.getElementById("capital").addEventListener("change",e=>{let n=Number(e.target.value);if(!Number.isFinite(n)||n<0){alert(lang==="ar"?"أدخل رأس مال صحيحًا.":"Enter valid capital.");e.target.value=startingCapital;return}startingCapital=n;saveData();renderFinance()});
document.getElementById("tradeForm").addEventListener("submit",e=>{
e.preventDefault();let risk=Number(document.getElementById("risk").value),pnl=Number(document.getElementById("pnl").value),result=document.getElementById("result").value;
if(!Number.isFinite(risk)||risk<=0||risk>100){alert(t().riskError);return}
let ok=Number.isFinite(pnl)&&((result==="WIN"&&pnl>0)||(result==="LOSS"&&pnl<0)||(result==="BE"&&pnl===0));if(!ok){alert(t().pnlError);return}
let trade={id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+"_"+Math.random().toString(16).slice(2)),pair:document.getElementById("pair").value.trim().toUpperCase(),date:document.getElementById("date").value,time:document.getElementById("tradeTime").value,direction:document.getElementById("direction").value,result,risk,pnl,timeframe:document.getElementById("timeframe").value,notes:document.getElementById("notes").value.trim(),checks:[...checks]};
if(!trade.pair||!trade.date||!trade.time){alert(lang==="ar"?"أكمل بيانات الصفقة.":"Complete trade details.");return}
trades.push(trade);let oldChecks=checks;checks=[false,false,false,false,false,false];if(!saveData()){trades.pop();checks=oldChecks;return}
document.getElementById("notes").value="";document.getElementById("risk").value="";document.getElementById("pnl").value="";setLanguage();alert(t().saved);if(currentUser)syncCloud();
});
document.getElementById("tradeList").addEventListener("click",async e=>{let b=e.target.closest("[data-delete]");if(b&&confirm(t().confirmDelete)){let id=b.dataset.delete,old=trades;trades=trades.filter(a=>a.id!==id);if(saveData()){render();if(currentUser){const {error}=await supabaseClient.from("trades").delete().eq("id",id).eq("user_id",currentUser.id);if(error)setAuthStatus(error.message,"offline")}}else trades=old}});
["searchTrade","filterResult","filterPair"].forEach(id=>document.getElementById(id).addEventListener(id==="searchTrade"?"input":"change",renderTradeList));
document.getElementById("clearFilterBtn").addEventListener("click",()=>{document.getElementById("searchTrade").value="";document.getElementById("filterResult").value="ALL";document.getElementById("filterPair").value="ALL";renderTradeList()});
document.getElementById("exportBtn").addEventListener("click",()=>{
if(!trades.length){alert(t().noData);return}
let backup={app:"IronTrade Journal",version:8,exportedAt:new Date().toISOString(),startingCapital,trades,currentChecklist:checks,language:lang};
let blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="IronTradeJournal-V8-Backup.json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);alert(t().exported);
});
document.getElementById("importBtn").addEventListener("click",()=>document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change",async e=>{
let file=e.target.files[0];if(!file)return;
try{
let data=JSON.parse(await file.text());
if(!data||!Array.isArray(data.trades)||!data.trades.every(validTrade)||!Number.isFinite(Number(data.startingCapital))||Number(data.startingCapital)<0)throw new Error("invalid");
if(!confirm(t().confirmImport))return;
let imported=data.trades.map(a=>({...a,checks:getChecks(a)}));
let old={trades,checks,startingCapital};
trades=imported;checks=Array.isArray(data.currentChecklist)&&data.currentChecklist.length===6?data.currentChecklist.map(Boolean):[false,false,false,false,false,false];startingCapital=Number(data.startingCapital);
if(saveData()){setLanguage();alert(t().imported)}else{trades=old.trades;checks=old.checks;startingCapital=old.startingCapital}
}catch(err){alert(t().importError)}finally{e.target.value=""}
});
document.getElementById("date").value=localDate();document.getElementById("tradeTime").value=new Date().toTimeString().slice(0,5);
setLanguage();
renderAuthState();initCloud();
</script></body></html>
